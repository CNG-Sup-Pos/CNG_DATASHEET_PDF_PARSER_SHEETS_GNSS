# field_aliases.yaml
# Canonical field -> aliases + label regexes + value regexes
# Label regexes are patterns to find the label text (case-insensitive).
# Value regexes are robust patterns that capture the value(s) following the label
# or that match value tokens when label proximity is used (units, separators, formats).

Model:
  aliases:
    - "Model"
    - "Product"
    - "Product name"
    - "Model name"
    - "Part number"
    - "SKU"
    - "Receiver model"
    - "Antenna model"
    - "Type"
  label_patterns:
    - '(?i)\\b(Model|Product(?!s?)|Product name|Model name|Part\\s*no\\.?|Part number|SKU|Type)\\b'
  value_patterns:
    - '(?i)\\b([A-Za-z0-9\\-_/\\+\\s\\.]+)\\b'   # fallback: alphanumeric model token

Form Factor:
  aliases:
    - "Form factor"
    - "Form-factor"
    - "Form"
    - "Enclosure"
    - "Product type"
    - "Housed"
    - "Board"
    - "Module"
    - "Smart antenna"
    - "OEM board"
  label_patterns:
    - '(?i)\\b(Form[ -]?factor|Enclosure|Product type|Housed|OEM board|Module|Smart antenna)\\b'
  value_patterns:
    - '(?i)\\b(board|receiver|smart antenna|housed|module|OEM|compact|rugged|housed unit|base station|rover)\\b'

INS:
  aliases:
    - "INS"
    - "GNSS/INS"
    - "Inertial"
    - "Inertial Navigation System"
    - "IMU"
    - "Integrated IMU"
    - "Inertial sensor"
    - "AHRS"
  label_patterns:
    - '(?i)\\b(INS|GNSS\\s*/\\s*INS|Inertial|Inertial Navigation System|IMU|AHRS|Inertial sensor)\\b'
  value_patterns:
    - '(?i)\\b(yes|no|optional|integrated|internal|external|embedded|\\bIMU\\b|\\bgyro\\b)\\b'
    - '(?i)\\b(\\+?\\d+\\.?\\d*°/?s|bias|noise|\\bgyro\\b|accelerometer|g)\\b'  # IMU spec tokens

RTK Accuracy:
  aliases:
    - "RTK accuracy"
    - "RTK performance"
    - "RTK-INS"
    - "Position accuracy (RTK)"
    - "Horizontal accuracy"
    - "Vertical accuracy"
    - "Fixed accuracy"
    - "Ambiguity-fixed accuracy"
  label_patterns:
    - '(?i)\\b(RTK(\\s*performance|\\s*accuracy)?|Position(\\s*accuracy)?\\s*\\(RTK\\)|Horizontal accuracy|Vertical accuracy|Fixed accuracy|Ambiguity[- ]?fixed)\\b'
  value_patterns:
    - '(?i)(?:Horizontal[:\\s]*)?([0-9]{1,3}(?:\\.[0-9]+)?\\s*(?:cm|m)\\s*(?:\\+\\s*[0-9]{1,3}\\s*ppm)?)'
    - '(?i)(?:Vertical[:\\s]*)?([0-9]{1,3}(?:\\.[0-9]+)?\\s*(?:cm|m)\\s*(?:\\+\\s*[0-9]{1,3}\\s*ppm)?)'
    - '(?i)([0-9]{1,3}(?:\\.[0-9]+)?\\s*cm\\s*(?:\\+\\s*[0-9]{1,3}\\s*ppm)?)'  # generic

