  aliases:
    - "Update rate"
    - "Maximum update rate"
    - "Position update rate"
    - "Output rate"
    - "Measurement rate"
    - "Navigation rate"
    - "Position and attitude rate"
    - "Max update rate"
    - "Hz"
  label_patterns:
    - '(?i)\\b(Max(imum)?\\s*update rate|Update rate|Position( and| &) attitude rate|Output rate|Measurement rate|Navigation rate)\\b'
  value_patterns:
    - '(?i)([0-9]{1,4}\\s*(?:Hz|hz))'
    - '(?i)(Position\\s*[:\\s]*[0-9]{1,4}\\s*Hz)'
    - '(?i)(Position and attitude\\s*[:\\s]*[0-9]{1,4}\\s*/\\s*[0-9]{1,4}\\s*Hz)'

