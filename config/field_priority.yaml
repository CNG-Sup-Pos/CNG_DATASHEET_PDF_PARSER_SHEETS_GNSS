# field_priority.yaml
# Ranks extraction order and maps canonical fields to parsers, expected units,
# normalization rules, and extraction hints. Higher priority (1) extracted first.

# parser names are symbolic: dimension_parser, accuracy_parser, frequency_parser, unit_parser, text_parser, list_parser, table_parser
# unit_parsers hint which units to normalize and which value_patterns to prefer
# confidence_threshold is used to flag low confidence extractions for manual review
# fallback_strategy indicates how to recover if primary method fails

Dimensions:
  priority: 1
  parser: dimension_parser
  unit_parsers:
    - mm
    - cm
    - m
  normalization:
    format: "{L} x {W} x {H} mm"
    rule: "Convert all numeric units to mm if unit present. If values provided without units and typical range < 5 assume mm else assume mm. Output three parts when possible; accept 2 parts as LxW."
  value_patterns:
    - '(?i)\\b([0-9]{1,4}(?:[\\.,][0-9]+)?\\s*(mm|cm|m)?)\\s*(?:[x×\\*\\u00D7\\s]+)\\s*([0-9]{1,4}(?:[\\.,][0-9]+)?\\s*(mm|cm|m)?)\\s*(?:[x×\\*\\u00D7\\s]+)\\s*([0-9]{1,4}(?:[\\.,][0-9]+)?\\s*(mm|cm|m)?)'
  confidence_threshold: 85
  fallback_strategy: "If separator-based parse fails, collect the nearest three numeric tokens on same line or adjacent right-hand column and normalize."

RTK_Accuracy:
  priority: 2
  parser: accuracy_parser
  unit_parsers:
    - cm
    - m
    - ppm
  normalization:
    format: "H: {H_acc} (+ {H_ppm} ppm) ; V: {V_acc} (+ {V_ppm} ppm)"
    rule: "Capture horizontal and vertical if both present. If only single accuracy present, place in both H and V fields with note. Preserve '+ ppm' part when present."
  value_patterns:
    - '(?i)(Horizontal\\s*accuracy[:\\s]*([0-9]+(?:\\.[0-9]+)?\\s*cm(?:\\s*\\+\\s*[0-9]+\\s*ppm)?))'
    - '(?i)(Vertical\\s*accuracy[:\\s]*([0-9]+(?:\\.[0-9]+)?\\s*cm(?:\\s*\\+\\s*[0-9]+\\s*ppm)?))'
    - '(?i)([0-9]+(?:\\.[0-9]+)?\\s*cm\\s*(?:\\+\\s*[0-9]+\\s*ppm)?)'
  confidence_threshold: 80
  fallback_strategy: "Search entire document for 'cm' tokens and choose the numeric token closest to 'RTK' or 'RTK performance' label."

Update_Rate:
  priority: 3
  parser: frequency_parser
  unit_parsers:
    - Hz
  normalization:
    format: "{pos_rate} Hz{, att_rate if present ' / ' + att_rate + ' Hz'}"
    rule: "If both position and attitude rates present, capture both. Convert all to integer Hz when possible."
  value_patterns:
    - '(?i)(?:Position(?:[:\\s]*))?([0-9]{1,4})\\s*Hz'
    - '(?i)([0-9]{1,4}\\s*Hz\\s*(?:pos|position|position and attitude)?)'
  confidence_threshold: 85
  fallback_strategy: "If no Hz found, look for 'updates per second' or numeric token near 'update rate' label."

Model:
  priority: 4
  parser: text_parser
  unit_parsers: []
  normalization:
    format: "{Model}"
    rule: "Trim whitespace, remove trailing punctuation. Prefer the token on same line after label or top page title if label missing."
  confidence_threshold: 90
  fallback_strategy: "Use filename as last resort."

Form_Factor:
  priority: 5
  parser: text_parser
  unit_parsers: []
  normalization:
    format: "{form_factor}"
    rule: "Normalize synonyms to canonical set: {board, receiver, smart antenna, housed, module, OEM}"
  confidence_threshold: 85
  fallback_strategy: "Infer from words like 'housed' 'board' 'antenna' in header or footer."

Heading:
  priority: 6
  parser: heading_parser
  unit_parsers:
    - degree_symbol: "°"
  normalization:
    format: "Yes (accuracy {heading_acc}) | No"
    rule: "If 'dual-antenna' present and heading accuracy present, record accuracy; if only 'yes/no' indicate presence."
  confidence_threshold: 80
  fallback_strategy: "If 'dual antenna' present but no accuracy, mark heading as 'Yes - accuracy unknown'."

Constellations_Bands:
  priority: 7
  parser: list_parser
  unit_parsers: []
  normalization:
    format: "Comma-separated list, grouped by constellation with tracked bands if present"
    rule: "Normalize standard constellation names (GPS, GLONASS, Galileo, BeiDou, QZSS, NavIC, SBAS). Expand common band tokens (L1, L2, L5, E1, E5a, B1)."
  confidence_threshold: 80
  fallback_strategy: "Collect all known constellation tokens and return combined list."

Channels:
  priority: 8
  parser: unit_parser
  unit_parsers:
    - integer
  normalization:
    format: "{channels} channels"
    rule: "Parse integer tokens near 'channels' label or 'hardware channels' text."
  confidence_threshold: 85
  fallback_strategy: "Find the largest integer in vendor-supplied 'channels' section."

IMU_Spec:
  priority: 9
  parser: imu_parser
  unit_parsers:
    - deg_per_sec
    - ug
    - deg_per_sqrt_hr
  normalization:
    format: "Gyro: {gyro_range}, Bias: {gyro_bias}, Noise: {gyro_noise}; Accel: {accel_range}, Bias: {accel_bias}, Noise: {accel_noise}"
    rule: "Group gyro and accel specs. Normalize units to common forms: °/s and μg. Fill fields with available tokens."
  confidence_threshold: 75
  fallback_strategy: "Aggregate IMU-related numeric tokens and label proximity; mark low confidence if ambiguous."

Interfaces:
  priority: 10
  parser: list_parser
  unit_parsers: []
  normalization:
    format: "Comma-separated canonical list (Ethernet, USB, RS232, RS422, CAN, CAN-FD, USB, PPS, Event marker, Cellular, Wi-Fi)"
    rule: "Map synonyms to canonical interface names."
  confidence_threshold: 90
  fallback_strategy: "Return any connectivity tokens found on same line as 'connect' or 'interface'."

Corrections_IO:
  priority: 11
  parser: list_parser
  unit_parsers: []
  normalization:
    format: "Comma-separated: RTCM versions, NTRIP (client/server/caster), L-band, RTX, CLAS, PPP, SSR"
    rule: "Recognize protocol names and versions. Normalize 'RTCM v2.x' and 'RTCM v3.x' forms."
  confidence_threshold: 85
  fallback_strategy: "Search for RTCM, NTRIP, L-band, RTX tokens anywhere in document."

Internal_Memory:
  priority: 12
  parser: unit_parser
  unit_parsers:
    - GB
    - MB
  normalization:
    format: "{size} GB"
    rule: "Convert MB to GB if necessary and standardize to integer or decimal GB with 1 decimal."
  confidence_threshold: 90
  fallback_strategy: "If no memory token, mark as 'None' or blank."

Power:
  priority: 13
  parser: power_parser
  unit_parsers:
    - VDC
    - W
    - mA
  normalization:
    format: "{input_voltage} VDC, {typical_power} W"
    rule: "Capture voltage ranges (e.g., 9-32 VDC). Capture typical and max W if present. Normalize separators (-, – , to)."
  confidence_threshold: 85
  fallback_strategy: "Extract any numeric token with V or W near 'power' or 'input'."

Weight:
  priority: 14
  parser: unit_parser
  unit_parsers:
    - g
    - kg
  normalization:
    format: "{weight} g"
    rule: "Normalize kg to g if kg present (1 kg = 1000 g)."
  confidence_threshold: 90
  fallback_strategy: "Pick numeric token with g or kg near 'weight'."

IP_Rating:
  priority: 15
  parser: text_parser
  unit_parsers: []
  normalization:
    format: "IP69K / IP68 etc"
    rule: "Uppercase token 'IP' + digits and optional 'K'."
  confidence_threshold: 90
  fallback_strategy: "Search for 'IP' tokens globally and prefer ones adjacent to 'Ingress protection'."

Dimensions_alt_handling:
  priority: 16
  parser: dimension_parser
  normalization:
    rule: "Specifically transforms separators: accepts 'x', '×', '*', '⋅', whitespace; handles optional repeated unit suffixes; merges units to end."

Temperature_Range:
  priority: 17
  parser: temp_parser
  unit_parsers:
    - degC
  normalization:
    format: "{min}°C to {max}°C"
    rule: "Normalize ranges and single values into 'min to max' if presented as single token assume symmetric tolerance omitted."
  confidence_threshold: 85
  fallback_strategy: "Look for separate 'operating' and 'storage' entries and map appropriately."

Time_Precision_PPS:
  priority: 18
  parser: unit_parser
  unit_parsers:
    - ns
  normalization:
    format: "{xPPS} ns"
    rule: "Capture 'xPPS' or 'PPS' values in ns. Normalize '< 5 ns' to '<5 ns' format."
  confidence_threshold: 85
  fallback_strategy: "Find 'PPS' and nearest numeric token."

TTFF:
  priority: 19
  parser: time_parser
  unit_parsers:
    - s
  normalization:
    format: "Cold: {cold}s, Warm: {warm}s, Reacq: {reacq}s"
    rule: "Place cold/warm/other starts into named subfields when listed; keep raw otherwise."
  confidence_threshold: 80
  fallback_strategy: "Capture any 'start' tokens with seconds."

Latency:
  priority: 20
  parser: unit_parser
  unit_parsers:
    - ms
  normalization:
    format: "{latency} ms"
  confidence_threshold: 80
  fallback_strategy: "Search for 'latency' or 'latency <' tokens."

Measurement_Precision:
  priority: 21
  parser: measurement_parser
  unit_parsers:
    - cm
    - mm
    - dB_Hz
  normalization:
    format: "{pseudorange_precision} / {carrier_phase_precision} / C/N0 {value} dB-Hz"
  confidence_threshold: 75
  fallback_strategy: "Aggregate any precision tokens near 'Measurement precision' header."

Tracking_Performance:
  priority: 22
  parser: list_parser
  unit_parsers:
    - dB_Hz
  normalization:
    format: "Tracking: {tracking} dB-Hz, Acquisition: {acquisition} dB-Hz"
  confidence_threshold: 80
  fallback_strategy: "Find C/N0 tokens or dB-Hz tokens and attach to tracking/acquisition."

RINEX_Logging:
  priority: 23
  parser: list_parser
  unit_parsers: []
  normalization:
    format: "{RINEX versions supported}"
    rule: "Return RINEX versions explicitly."
  confidence_threshold: 90
  fallback_strategy: "If RINEX not found, search for 'raw' and 'obs' tokens."

Formats:
  priority: 24
  parser: list_parser
  normalization:
    format: "Comma-separated known formats"
  confidence_threshold: 85
  fallback_strategy: "Collect format tokens anywhere in doc."

Interfaces_secondary:
  priority: 25
  parser: list_parser
  normalization:
    rule: "Collect and canonicalize non-essential interface tokens (FTP, HTTP, event markers)."

Use_Cases:
  priority: 26
  parser: list_parser
  normalization:
    format: "Comma-separated short use-case list"
  confidence_threshold: 70
  fallback_strategy: "Extract from 'Applications' or 'Typical use' sections."

Corrections_secondary:
  priority: 27
  parser: list_parser
  normalization:
    rule: "Additional correction protocols and services; list as found."

Processing_Metrics:
  priority: 99
  parser: internal_logger
  normalization:
    rule: "Populate confidence, extraction method and notes for manual review."
  confidence_threshold: 0
  fallback_strategy: "Always produce a log entry."

# Parser-level default behavior
defaults:
  fuzzy_threshold: 80
  max_label_distance_px: 200           # max horizontal distance (px) to consider a value for a label
  max_line_gap: 1                      # lines below a label to consider
  numeric_merge_window: 3              # max neighbouring numeric tokens to group for one value
  dimension_separators: ['x','×','*','·','⋅',' ']
  unit_priority_order:
    - mm
    - cm
    - m
    - V
    - W
    - Hz
    - degC
    - ppm
